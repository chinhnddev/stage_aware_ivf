device: cuda

model:
  dims: [32, 64, 128]
  feature_dim: 256
  width_mult: 3.0
  depth_mult: 2.0

data:
  root_dir: data/humanembryo2_images

training:
  image_size: 224
  batch_size: 128
  epochs: 50
  lr: 0.0003
  weight_decay: 0.05
  warmup_epochs: 5
  num_workers: 8
  normalize: true
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  rotation_degrees: 15.0
