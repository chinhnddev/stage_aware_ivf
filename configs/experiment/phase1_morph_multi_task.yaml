base_config: configs/experiment/base.yaml

model:
  name: joint_morph
  fusion_mode: sum
  attention_type: eca

transforms:
  image_size: 224
  crop_size: 224
  train_crop_scale: [0.8, 1.0]
  train_crop_ratio: [0.9, 1.1]
  train_translate_max: 0.0
  rotation_degrees: 15
  enable_vertical_flip: false

training:
  use_cosine_warmup: true
  warmup_epochs: 5
  min_lr: 0.000001
  ema_decay: 0.999
  morph:
    mode: multi_task
    exp_max: 5
  mtl:
    grad_strategy: pcgrad

morph_score:
  weights:
    exp: 1.0
    icm: 1.0
    te: 1.0
  missing_strategy: neutral
  neutral_icm_score: 2.0
  neutral_te_score: 2.0
  confidence_lambda: 0.0
