base_config: configs/experiment/phase1_morph_multi_task.yaml

model:
  name: joint_morph
  width_mult: 4.0
  depth_mult: 3.0

training:
  init_ckpt_imagenet: outputs/pretrain/imagenet_best.ckpt
  morph:
    mode: multi_task
    exp_max: 5
    finetune_stage1_epochs: 5
    finetune_stage2_epochs: 15
    finetune_stage1_lr: 0.0001
    finetune_stage2_lr: 0.00001
    finetune_unfreeze_last_blocks: 2
